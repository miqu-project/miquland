#
# miquland.conf — Hierarchical Configuration File
# Miqu Desktop Ecosystem Wayland Compositor
# ==============================================================================
# This configuration file controls all compositor behaviors, input devices,
# display layouts, window tiling, rendering effects, animations, layer shell
# rules, window rules, gestures, and keybindings.
# ==============================================================================

# ==============================================================================
# 1. PLUGINS & IPC EXTENSIONS
# ==============================================================================
# Dynamically loaded shared library plugins (.so) expanding compositor capabilities.
plugins {
    # Live workspace expose and visual application switcher
    load = /usr/lib/miquland/plugins/libmiquoverview.so
}

# ==============================================================================
# 2. AUTOSTART SERVICES & DAEMONS
# ==============================================================================
# Background applications launched at compositor startup.
# - exec_once : Spawned exactly once during initial compositor initialization.
# - exec      : Spawned on every configuration reload / compositor restart.
autostart {
    # Restore wallpaper and dynamic theme colors on startup
    exec_once = miqutheme --restore &

    # Miqu Desktop Ecosystem native components
    exec_once = miqupolkit &
    exec_once = miqudesk &
    exec_once = miquidle &

    # System status bars & notification daemons
    exec_once = miqubar &
    exec_once = miqunotify &

    # Network & system tray applets (starts after status bar is ready)
    exec_once = nm-applet &

    # Clipboard manager persistence daemon
    exec_once = wl-paste --watch cliphist store &

    # XDG Desktop Portal backend refresh (required for OBS screen recording across compositor restarts)
    exec_once = systemctl --user restart xdg-desktop-portal-wlr &

    # Night light / blue light filter (optional, wlr-gamma-control):
    # exec_once = gammastep -O 4500 &
}

# ==============================================================================
# 3. CURSOR & APPEARANCE
# ==============================================================================
# Cursor theme and rendering size across the compositor surface.
cursor {
    # XCursor theme name (located in /usr/share/icons or ~/.icons)
    theme = default

    # Cursor size in pixels (typical values: 16, 24, 32, 48)
    size = 30
}

# ==============================================================================
# 4. MONITORS & DISPLAY TOPOLOGY
# ==============================================================================
# Display output configuration syntax:
# monitor = <name>, <resolution>@<refresh_rate>, <position>, <scale>, [transform]
#
# Arguments:
# - name        : Output connector (e.g. eDP-1, HDMI-A-1, DP-1) or empty/asterisk for default.
# - resolution  : WidthxHeight (e.g. 1920x1080, 2560x1440, preferred, auto, highrr).
# - position    : XxY coordinate offset (e.g. 0x0, 1920x0, auto).
# - scale       : Display scaling factor (e.g. 1.0, 1.25, 1.5, 2.0).
# - transform   : Rotation (0: normal, 1: 90 deg, 2: 180 deg, 3: 270 deg, flipped).
monitors {
    # Default fallback matching any connected output automatically:
    monitor = , preferred, auto, 1

    # Examples for specific hardware configurations:
    # monitor = eDP-1, 1920x1080@60, 0x0, 1
    # monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1
    # monitor = DP-1, disable
}

# ==============================================================================
# 5. GENERAL TILING, GAPS & BORDERS
# ==============================================================================
# Window layout geometry, space management, and window frame styling.
general {
    # Layout engine:
    # - 'dwindle'        : Dynamic Binary Space Partitioning (BSP tiling).
    # - 'stack'          : Master-and-stack column layout (master view on left, vertical stack on right).
    # - 'bstack'         : Bottom-stack layout (master view on top, horizontal stack on bottom).
    # - 'centeredmaster' : Master view in center, flanked by left and right stacks.
    # - 'spiral'         : Fibonacci spiral alternating splits clockwise.
    # - 'columns'        : Divides screen into equal-width vertical columns side by side.
    # - 'grid'           : Arranges windows in an equal N x M matrix (bottom row expands evenly).
    # - 'monocle'        : Full-screen focused window layout (active window brought to top).
    layout = dwindle

    # Initial split ratio for binary tiling (range: 0.1 to 0.9, default: 0.5)
    default_split_ratio = 0.5

    # Dwindle Layout Tuning:
    dwindle {
        # Split focus window:
        # - false : New windows spawn at the tail/spiral, preserving focused window size (recommended default).
        # - true  : New windows split the currently focused/active window (Hyprland style).
        split_focus = false

        # Aspect ratio threshold to favor horizontal (side-by-side) splits on widescreen monitors.
        # Window width must be >= height * split_width_multiplier to split horizontally into columns (default: 1.2).
        split_width_multiplier = 1.2

        # Preserve split orientation: Retains horizontal/vertical node split directions when windows close or move.
        preserve_split = true

        # Smart cursor-aware splitting:
        # - false : New window is placed in the standard trailing slot (right or bottom)
        #           based on the window aspect ratio and split_width_multiplier.
        # - true  : Split orientation (horizontal vs vertical) is still governed by the
        #           aspect ratio, but cursor position decides which side the new window occupies:
        #           - Horizontal split (wide window): Cursor on left/right half -> new window opens at left/right.
        #           - Vertical split (tall window)  : Cursor on top/bottom half -> new window opens at top/bottom.
        #           Also targets whichever tiled window is directly under the cursor.
        smart_split = true
    }

    # Smart Gaps: Automatically collapse gaps and borders when only one window is tiled on screen
    smart_gaps = false

    # Asynchronous Tearing Page-Flips (wp_tearing_control_v1 protocol support):
    # Allows tearing for fullscreen games and applications with presentation hint or immediate window rule,
    # minimizing display input latency at the expense of screen tearing.
    allow_tearing = false

    # Workspace Cycling: Wrap around when navigating past the first or last workspace
    workspace_cycle = false

    # Variable Frame Rate (VFR): Throttle compositing loop when idle to reduce CPU usage
    vfr = true

    # Direct border mouse drag resizing without requiring modifier key:
    resize_on_border = true
    border_grab_area = 8

    # Auto-float fixed-size windows: Automatically float and center any xdg_toplevel that
    # declares non-resizable size constraints (min_size == max_size).  This covers apps like
    # Android Studio's Welcome screen, JetBrains toolbox launchers, and similar splash/picker
    # dialogs that render a small UI inside a full tile and end up stuck in the top-left corner.
    # Disable this only if a specific app misbehaves with the heuristic (use a windowrule instead).
    auto_float_fixed_size = true

    # Gaps configuration:
    gaps {
        # Inner gap: Spacing between adjacent tiled windows (in pixels)
        inner = 8

        # Outer gap: Margin between windows and monitor screen edges (in pixels)
        outer = 12
    }

    # Window borders & frame decoration:
    border {
        # Border thickness in pixels (0 disables window borders)
        width = 1

        # Corner radius rounding for windows (in pixels)
        radius = 18

        # Border color for active focused window:
        # Supports single hex color (#RRGGBB / #RRGGBBAA) or multi-stop linear gradient with optional angle (e.g. 45deg, 90deg, 135deg).
        # Examples:
        # active = #0066ff
        # active = #0066ff #00ffcc 45deg
        # active = #ff007f #7928ca #0066ff 135deg
        active = #ffff00 #ff0000 45deg

        # Border color for inactive unfocused windows (single color or multi-stop gradient):
        # Examples:
        inactive = #99c2ff
        # inactive = #334455 #222d38 45deg
        # inactive = #aa9900 #aa3333 45deg

        # Border shading: subtle 3D lighting / specular bevel depth across the border stroke
        shading = false

        # Border shading intensity (range: 0.0 subtle to 1.0 strong, default: 0.35)
        shading_strength = 0.35
    }
}

# ==============================================================================
# 6. DECORATIONS & SCENEFX BLUR & SHADOWS
# ==============================================================================
# Window opacity, translucency, Dual Kawase background blur, and GPU drop shadows.
decoration {
    # Window surface opacity (range: 0.0 transparent to 1.0 fully opaque)
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Dual Kawase background blur filter:
    blur {
        # Master toggle for background blur underneath translucent surfaces
        enabled = true

        # Blur sampling radius / spread (higher = softer blur, default: 5)
        radius = 18

        # Downsampling iterations (higher = stronger blur & smoother diffusion, default: 3)
        passes = 3

        # Shader fine-tuning:
        noise = 0.02
        brightness = 0.9
        contrast = 0.9
        saturation = 1.1
    }

    # Hardware-accelerated SceneFX window drop shadows & ambient shading:
    shadow {
        # Enable GPU-rendered drop shadows underneath windows
        enabled = false

        # Shadow blur sigma / softness radius in pixels (supports floating point, e.g. 12.0, 16.0, 24.0)
        range = 16.0

        # Shadow color for active focused window (hex format: #RRGGBBAA)
        color = #00000055

        # Shadow color for inactive unfocused windows (hex format: #RRGGBBAA)
        color_inactive = #00000033

        # Shadow offset [X, Y] in pixels (supports floating point, e.g. 0 4, 0 6)
        offset = 0.0 6.0
    }
}

# ==============================================================================
# 7. ANIMATION ENGINE
# ==============================================================================
# GPU-accelerated motion dynamics for windows, layer surfaces, and workspace sliding.
#
# Easing Curves & Motion Choreography Conventions:
# - User-defined named cubic Bézier curves: bezier = <name>, <x1>, <y1>, <x2>, <y2>
# - Physical harmonic springs: curve = spring (default damping 0.68, freq 11.5), spring_gentle, spring_bouncy, or spring(damping, frequency)
# - Entrances (Windows/Popups opening): Ease-Out (deceleration) with subtle scale (0.95 -> 1.0).
#   Starts snappy and decelerates to rest so the eye can register the destination smoothly.
# - Exits (Windows/Popups closing): Ease-In / Smooth-In (acceleration) with brisk duration.
#   Accelerates out immediately so dismissed surfaces get out of the user's way fast.
# - Relocations (Workspaces & Tiling): Ease-In-Out (symmetric acceleration & deceleration).
#   Both start and endpoints are visible; smooth at both ends.
animations {
    # Master switch for all animations across the compositor
    enabled = true

    # --------------------------------------------------------------------------
    # Custom Named Cubic Bézier Curves (Reusable across all animation targets):
    # Format: bezier = <name>, <x1>, <y1>, <x2>, <y2>
    # --------------------------------------------------------------------------
    # Snappy initial launch with an ultra-silky, smooth deceleration tail:
    bezier = snappy_smooth, 0.05, 0.9, 0.15, 1.0
    bezier = fluent, 0.1, 1.0, 0.15, 1.0
    bezier = smooth_pop, 0.16, 1.0, 0.3, 1.0
    bezier = smooth_slide, 0.1, 1.0, 0.15, 1.0
    bezier = default, 0.05, 0.9, 0.1, 1.02
    bezier = ease_out_cubic, 0.33, 1.0, 0.68, 1.0
    bezier = ease_in_cubic, 0.32, 0.0, 0.67, 0.0
    bezier = ease_in_out_cubic, 0.65, 0.0, 0.35, 1.0
    bezier = smooth_out, 0.16, 1.0, 0.3, 1.0
    bezier = smooth_in, 0.3, 0.0, 0.8, 0.15
    bezier = overshoot, 0.05, 0.9, 0.1, 1.06
    bezier = md3_decel, 0.05, 0.7, 0.1, 1.0
    bezier = md3_accel, 0.3, 0.0, 0.8, 0.15
    # Organic spring curves:
    bezier = spring_soft, 0.18, 1.22, 0.38, 1.0
    bezier = spring_bouncy, 0.17, 1.28, 0.36, 1.0
    bezier = spring_light, 0.12, 1.12, 0.24, 1.02

    # --------------------------------------------------------------------------
    # Unified Animation Directives (Concise One-Liner Syntax):
    # Format: animation = <target>, <enabled>, <duration_ms>, <curve>, [<style>]
    #
    # Supported targets:
    #   - windows, windowsIn, windowsOut, windowsMove
    #   - fade, fadeIn, fadeOut
    #   - layers, layersIn, layersOut
    #   - workspaces
    #
    # Supported curves:
    #   - Named Béziers: snappy_smooth, fluent, smooth_pop, smooth_slide, default,
    #     ease_out_cubic, ease_in_cubic, ease_in_out_cubic, smooth_out, smooth_in,
    #     overshoot, md3_decel, md3_accel, linear
    #   - Physical springs: spring (natural bounce), spring_gentle, spring_bouncy,
    #     or spring(damping, frequency) e.g. spring(0.72, 5.6)
    #
    # Supported styles:
    #   - Windows: split (expanding split from seam - default for tiled), popin, popin <percent>%, slide, fade, none
    #   - Layers:  popin [scale%], slide [top|bottom|left|right], unroll, fold, unfold, fade, none
    #   - Workspaces: slide
    #
    # Examples (can be used directly or mixed with the block syntax below):
    # animation = windows, 1, 240, snappy_smooth, popin 90%
    # animation = windowsIn, 1, 240, snappy_smooth, split
    # animation = windowsMove, 1, 240, snappy_smooth
    # animation = windowsOut, 1, 180, ease_out_cubic, popin 92%
    # animation = fade, 1, 180, ease_out_cubic
    # animation = fadeIn, 1, 180, ease_out_cubic
    # animation = fadeOut, 1, 160, ease_out_cubic
    # animation = layers, 1, 220, snappy_smooth, popin 92%
    # animation = layersIn, 1, 220, snappy_smooth, popin 92%
    # animation = layersOut, 1, 160, ease_out_cubic, popin 94%
    # animation = workspaces, 1, 340, smooth_slide, slide
    # --------------------------------------------------------------------------

    # Hierarchical block configuration (fully compatible and combinable with above):
    windows {
        enabled = true
        duration = 320
        curve = spring_gentle

        # Window movement / geometry resize animation (tiling layout recalculations):
        # Option A: Liquid Seam Split with spring_gentle for organic, continuous division
        move {
            enabled = true
            duration = 320
            curve = spring_gentle
            defer = 15             # Optional delay (ms) before starting move (useful if pairing with popin)
        }

        # Window opening entrance animation:
        # Default for tiled windows: "split" (synchronous expanding split locked to sibling seam, 0 wallpaper leak)
        # Default for floating windows: "popin" globally (organic water bubble emergence from 30% scale)
        open {
            tiled_style = split
            floating_style = popin
            duration = 360
            curve = spring_gentle
            scale = 0.30

            # Micro-control opacity fade timeline:
            fade {
                enabled = true
                duration = 240
                curve = ease_out_cubic
            }
        }

        # Window closing exit animation:
        # Decisive and crisp exit without lingering or distracting the user.
        close {
            duration = 180
            curve = ease_out_quad
            scale = 0.40

            # Micro-control opacity fade timeline:
            fade {
                enabled = true
                duration = 150
                curve = ease_out_cubic
            }
        }
    }

    # Layer surface transitions (Wayland panels, launchers, lockscreens, overlays):
    layers {
        enabled = true
        duration = 200
        curve = md3_decel
        popin_scale = 0.92

        # Entrance animation for layer surfaces:
        open {
            enabled = true
            duration = 200
            curve = md3_decel

            fade {
                enabled = true
                duration = 150
                curve = ease_out_cubic
            }
        }

        # Exit / dismissal animation for layer surfaces:
        close {
            enabled = true
            duration = 150
            curve = ease_out_cubic

            fade {
                enabled = true
                duration = 130
                curve = ease_out_cubic
            }
        }
    }

    # Workspace swipe and switch transitions (smooth glide across monitor):
    workspaces {
        enabled = true
        duration = 340
        curve = smooth_slide
    }
}

# ==============================================================================
# 8. INPUT DEVICES, PERIPHERALS & GESTURES
# ==============================================================================
# Hardware peripheral configuration, XKB keymaps, touchpads, and multi-touch gestures.
input {
    # Default terminal emulator invoked by 'terminal' action
    terminal = kitty --single-instance

    # Keyboard layout & repeat behavior:
    keyboard {
        layout = us
        # variant =
        # options = grp:alt_shift_toggle,caps:escape
        # model =
        repeat_rate = 25
        repeat_delay = 600
    }

    # Touchpad gestures & ergonomics:
    touchpad {
        tap_to_click = true
        natural_scroll = false
        disable_while_typing = true
        accel_speed = 0.0
        accel_profile = adaptive
    }

    # Mouse pointer configuration:
    mouse {
        accel_speed = 0.0
        accel_profile = adaptive
        natural_scroll = false
    }

    # Touchscreen hardware association:
    touchscreen {
        # output = eDP-1
    }

    # Multi-finger trackpad and touchscreen gesture recognition:
    gestures {
        # Interactive workspace swipe kinematics & physics:
        workspace_swipe {
            touchpad_multiplier = 1.0
            touchscreen_multiplier = 1.0
            swipe_threshold = 50
            touchscreen_threshold = 100
            cancel_ratio = 0.30
            min_speed_to_force = 0.3
            edge_resistance = 0.15
        }

        # Discrete gesture bindings:
        # Format: gesture = swipe:<fingers>:<direction>, <action>
        # Supported directions: left, right, up, down
        gesture = swipe:3:left, next_ws
        gesture = swipe:3:right, prev_ws
        gesture = swipe:3:up, toggle_fullscreen
        gesture = swipe:3:down, toggle_floating
        gesture = swipe:4:up, miqulauncher -list
        gesture = swipe:4:down, miqulock
    }
}

# ==============================================================================
# 9. XWAYLAND COMPATIBILITY
# ==============================================================================
# High-DPI unscaling for legacy X11 applications running through XWayland.
xwayland {
    # Force 1:1 unscaled buffer rendering to eliminate blur on scaled displays
    force_zero_scaling = true
}

# ==============================================================================
# 10. LAYER SURFACE RULES (PER NAMESPACE / WILDCARD PATTERNS)
# ==============================================================================
# Per-layer micro-level overrides for blur shaders, geometry animations, and fade curves.
# Target namespaces support exact names ("miqubar"), wildcard globs ("miqubar*", "*"),
# and automatic sub-namespace matching ("miqubar" automatically covers "miqubar-calendar",
# "miqubar-sound", etc. unless overridden by a more specific rule).
#
# Supported animation styles:
# - unroll      : Smooth vertical curtain rollout / roll-up from top
# - fold / roll : Vertical rollout collapse
# - unfold      : Symmetric vertical expansion from center
# - popin       : Scale bounce with opacity fade (ideal for centered modals)
# - slide       : Edge sliding (slide top, slide bottom, slide left, slide right)
# - fade        : Pure opacity fade without spatial movement
# - none        : Instant appearance/dismissal without animation
#
# Supported decorations:
# - blur        : Enable SceneFX background blur (true/false)
#   - blur_bottom_only    : Sample only the wallpaper layer beneath (ideal for bars/lockscreens)
#   - blur_corner_radius  : Round the frosted glass backdrop to match surface corners (e.g. 12)
#   - blur_alpha          : Modulate backdrop blur opacity (0.0 transparent to 1.0 full)
#   - blur_ignore_opacity : Ignore client alpha channel cutouts and blur full bounding box (true/false)
# - shadow      : Enable SceneFX drop shadow (true/false)
#   - shadow_range        : Blur sigma / softness (e.g. 20)
#   - shadow_radius       : Corner radius (e.g. 12)
#   - shadow_color        : Color hex (e.g. "#00000066")
#   - shadow_offset       : Offset [X, Y] (e.g. 0 8)

# Example 1: Centered application launcher (Spotlight/Rofi-style organic fluid bubble emergence):
layerrule "miqulauncher" {
    blur = true
    blur_corner_radius = 16
    shadow = true
    shadow_range = 24
    shadow_radius = 16
    shadow_offset = 0 8
    animation_open = popin 30% 360ms spring_gentle
    animation_close = popin 30% 180ms ease_out_quad
}

layerrule "miqutest" {
    blur = true
    blur_corner_radius = 16
    shadow = true
    shadow_range = 24
    shadow_radius = 16
    shadow_offset = 0 8
    animation_open = popin 30% 360ms spring_gentle
    animation_close = popin 30% 180ms ease_out_quad
}

layerrule "miqupower" {
    blur = true
    blur_corner_radius = 18
    shadow = true
    shadow_range = 28
    shadow_radius = 18
    shadow_offset = 0 8
    animation_open = popin 30% 360ms spring_gentle
    animation_close = popin 30% 180ms ease_out_quad
}

# Example 2: Centered authentication dialog with rounded blur, fluid popin scaling, and drop shadow:
layerrule "miqupolkit" {
    blur = true
    blur_corner_radius = 14
    blur_alpha = 0.95
    shadow = true
    shadow_range = 22
    shadow_offset = 0 8
    shadow_radius = 14
    animation_open = popin 35% 360ms spring_gentle
    animation_close = popin 35% 180ms ease_out_quad
}

# Example 3: Session lock screen background blur & unlock animation (miqulock / sessionlock)
layerrule "miqulock" {
    blur = true
    blur_bottom_only = true  # Blurs wallpaper directly behind lockscreen
    animation_open = none
    animation_close = fade 280ms ease_out_cubic
}

# Miqubar flyouts & popups (calendar, sound, bluetooth, network, taskbar menu, workspaces)
layerrule "miqubar-*" {
    blur = true
    blur_corner_radius = 14
    shadow = true
    shadow_range = 20
    shadow_radius = 14
    shadow_offset = 0 6
    animation_open = popin 40% 320ms spring_gentle
    animation_close = popin 50% 160ms ease_out_quad
}

# Bottom panel sliding from screen edge (pure edge motion):
layerrule "miqubar" {
    blur = true
    blur_bottom_only = true
    shadow = true
    animation_open = none
    animation_close = slide_bottom 160ms ease_out_cubic
}

# Live workspace overview overlay (instant fade with no spatial distortion):
layerrule "miquoverview" {
    blur = true
    blur_bottom_only = true
    animation_open = fade 170ms ease_out_cubic
    animation_close = none
}

# Example 4: Notification daemon toast overlay (slide from right with fast fade):
layerrule "miqunotify" {
    blur = true
    animation_open = slide_right 200ms md3_decel
    animation_close = fade 140ms ease_out_cubic
}

# Slide-out notification center drawer:
layerrule "miqunotify-center" {
    blur = true
    shadow = true
    animation_open = slide_right 220ms md3_decel
    animation_close = slide_right 160ms ease_out_cubic
}

# Example 5: Instant rendering without motion for desktop wallpaper / canvas:
layerrule "miqudesk" {
    animation = none
}

layerrule "miqubg" {
    animation_open = fade 450ms ease_out_cubic
    animation_close = none
}

layerrule "wallpaper" {
    animation_open = fade 450ms ease_out_cubic
    animation_close = none
}

# ==============================================================================
# 11. WINDOW RULES (PER APPLICATION / CLASS / TITLE)
# ==============================================================================
# Granular layout policies, workspace pinning, opacity, blur, shadow, and animation overrides.
#
# Target Matching Syntax:
# - Matches against Wayland app_id, XWayland window class, or window title substring.
# - Explicit prefix matching:
#     class:<pattern>  -> matches only window class / app_id (case-insensitive substring)
#     title:<pattern>  -> matches only window title (case-insensitive substring)
#     <pattern>        -> matches either class or title (case-insensitive substring)
#
# Supported Properties:
# - Layout & Geometry:
#     float = true / false        : Force window to float or tile
#     center = true               : Center floating window on screen
#     workspace = <number>        : Assign window to specific workspace (1-10)
#     size = <width> <height>     : Initial window dimensions in pixels
#     move = <x> <y>              : Initial window position in pixels
# - Visual Decorations:
#     opacity = <0.0 - 1.0>       : Window surface opacity
#     blur = true / false         : Toggle background blur (or one-liner: windowrule = noblur, <target>)
#     shadow = true / false       : Toggle drop shadow (or one-liner: windowrule = noshadow, <target>)
#     shadow_range = <sigma>      : Drop shadow blur softness in pixels (e.g. 16)
#     shadow_offset = <x> <y>     : Drop shadow offset in pixels (e.g. 0 6)
#     shadow_radius = <pixels>    : Corner radius for drop shadow
#     shadow_color = <#RRGGBBAA>  : Hex color for drop shadow
# - Motion & Dynamics:
#     animation_open = <style> [duration] [curve]   : Window entrance override (e.g. popin 90% 420ms snappy_smooth)
#     animation_close = <style> [duration] [curve]  : Window exit override (e.g. popin 94% 260ms ease_out_cubic)
# - Performance & Gaming:
#     immediate = true / false    : Enable screen tearing / bypass VSync (ideal for low-latency games)
#
# Syntax Variants:
#   1. Block Syntax:    windowrule "<target>" { <prop> = <value> ... }
#   2. One-Liner Form:  windowrule = <rule> [args], <target>  (e.g. windowrule = float, mpv)

# System dialogs and portal floating:
windowrule "xdg-desktop-portal-gtk" {
    float = true
}

windowrule "org.freedesktop.impl.portal.desktop.gtk" {
    float = true
}

# Native Miqu Ecosystem Applications (floating dialogs & utilities):
windowrule "miqutheme" {
    float = true
    center = true
    size = 650 720
    animation_open = popin 92% 200ms md3_decel
    animation_close = popin 94% 160ms ease_out_cubic
}

windowrule "miqumusic" {
    float = true
    center = true
    size = 800 600
    animation_open = popin 92% 200ms md3_decel
    animation_close = popin 94% 160ms ease_out_cubic
}

windowrule "miqusecure" {
    float = true
    center = true
    size = 900 650
    animation_open = popin 92% 200ms md3_decel
    animation_close = popin 94% 160ms ease_out_cubic
}

windowrule "miquinfo" {
