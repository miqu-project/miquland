#
# miquland.conf — Hierarchical Configuration File
# Miqu Desktop Ecosystem Wayland Compositor
# ==============================================================================
# This configuration file controls all compositor behaviors, input devices,
# display layouts, window tiling, rendering effects, animations, layer shell
# rules, window rules, gestures, and keybindings.
# ==============================================================================

# ==============================================================================
# 1. PLUGINS & IPC EXTENSIONS
# ==============================================================================
# Dynamically loaded shared library plugins (.so) expanding compositor capabilities.
plugins {
    # Live workspace expose and visual application switcher
    load = /usr/lib/miquland/plugins/libmiquoverview.so
}

# ==============================================================================
# 2. AUTOSTART SERVICES & DAEMONS
# ==============================================================================
# Background applications launched at compositor startup.
# - exec_once : Spawned exactly once during initial compositor initialization.
# - exec      : Spawned on every configuration reload / compositor restart.
autostart {
    # Miqu Desktop Ecosystem native components
    
    exec_once = miqupolkit &
    exec_once = miqudesk &
    exec_once = miquidle &

    # System status bars & notification daemons
    exec_once = waybar &
    exec_once = dunst &
    exec_once = nm-applet &

    # Clipboard manager persistence daemon
    exec_once = wl-paste --watch cliphist store &
    # theme script that sets current wallpaper along with matugen colors
      exec_once = .config/theme/scripts/setwallpaper

    # Night light / blue light filter (optional, wlr-gamma-control):
    # exec_once = gammastep -O 4500 &
}

# ==============================================================================
# 3. CURSOR & APPEARANCE
# ==============================================================================
# Cursor theme and rendering size across the compositor surface.
cursor {
    # XCursor theme name (located in /usr/share/icons or ~/.icons)
    theme = default

    # Cursor size in pixels (typical values: 16, 24, 32, 48)
    size = 24
}

# ==============================================================================
# 4. MONITORS & DISPLAY TOPOLOGY
# ==============================================================================
# Display output configuration syntax:
# monitor = <name>, <resolution>@<refresh_rate>, <position>, <scale>, [transform]
#
# Arguments:
# - name        : Output connector (e.g. eDP-1, HDMI-A-1, DP-1) or empty/asterisk for default.
# - resolution  : WidthxHeight (e.g. 1920x1080, 2560x1440, preferred, auto, highrr).
# - position    : XxY coordinate offset (e.g. 0x0, 1920x0, auto).
# - scale       : Display scaling factor (e.g. 1.0, 1.25, 1.5, 2.0).
# - transform   : Rotation (0: normal, 1: 90 deg, 2: 180 deg, 3: 270 deg, flipped).
monitors {
    # Default fallback matching any connected output automatically:
    monitor = , preferred, auto, 1

    # Examples for specific hardware configurations:
    # monitor = eDP-1, 1920x1080@60, 0x0, 1
    # monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1
    # monitor = DP-1, disable
}

# ==============================================================================
# 5. GENERAL TILING, GAPS & BORDERS
# ==============================================================================
# Window layout geometry, space management, and window frame styling.
general {
    # Layout engine:
    # - 'spiral' : Binary Space Partitioning (Fibonacci / BSP) alternating horizontal/vertical.
    # - 'stack'  : Master-and-stack column layout (main view left, vertical stack right).
    layout = spiral

    # Initial split ratio for binary tiling (range: 0.1 to 0.9, default: 0.5)
    default_split_ratio = 0.5

    # Smart Gaps: Automatically collapse gaps and borders when only one window is tiled on screen
    smart_gaps = false

    # Asynchronous Tearing Page-Flips (wp_tearing_control_v1 protocol support):
    # Allows tearing for fullscreen games and applications with presentation hint or immediate window rule,
    # minimizing display input latency at the expense of screen tearing.
    allow_tearing = false

    # Workspace Cycling: Wrap around when navigating past the first or last workspace
    workspace_cycle = false

    # Direct border mouse drag resizing without requiring modifier key:
    resize_on_border = true
    border_grab_area = 6

    # Auto-float fixed-size windows: Automatically float and center any xdg_toplevel that
    # declares non-resizable size constraints (min_size == max_size).  This covers apps like
    # Android Studio's Welcome screen, JetBrains toolbox launchers, and similar splash/picker
    # dialogs that render a small UI inside a full tile and end up stuck in the top-left corner.
    # Disable this only if a specific app misbehaves with the heuristic (use a windowrule instead).
    auto_float_fixed_size = true

    # Gaps configuration:
    gaps {
        # Inner gap: Spacing between adjacent tiled windows (in pixels)
        inner = 8

        # Outer gap: Margin between windows and monitor screen edges (in pixels)
        outer = 12
    }

    # Window borders & frame decoration:
    border {
        # Border thickness in pixels (0 disables window borders)
        width = 2

        # Corner radius rounding for windows (in pixels)
        radius = 10

        # Border color for active focused window:
        # Supports single hex color (#RRGGBB / #RRGGBBAA) or multi-stop linear gradient with optional angle (e.g. 45deg, 90deg, 135deg).
        # Examples:
        # active = #0066ff
        # active = #0066ff #00ffcc 45deg
        # active = #ff007f #7928ca #0066ff 135deg
        active = #ffff00 #ff0000 45deg

        # Border color for inactive unfocused windows (single color or multi-stop gradient):
        # Examples:
        # inactive = #99c2ff
        # inactive = #334455 #222d38 45deg
        inactive = #aa9900 #aa3333 45deg

        # Border shading: subtle 3D lighting / specular bevel depth across the border stroke
        shading = false

        # Border shading intensity (range: 0.0 subtle to 1.0 strong, default: 0.35)
        shading_strength = 0.35
    }
}

# ==============================================================================
# 6. DECORATIONS & SCENEFX BLUR & SHADOWS
# ==============================================================================
# Window opacity, translucency, Dual Kawase background blur, and GPU drop shadows.
decoration {
    # Window surface opacity (range: 0.0 transparent to 1.0 fully opaque)
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Dual Kawase background blur filter:
    blur {
        # Master toggle for background blur underneath translucent surfaces
        enabled = true

        # Blur sampling radius / spread (higher = softer blur, default: 5)
        radius = 5

        # Downsampling iterations (higher = stronger blur & smoother diffusion, default: 3)
        passes = 3

        # Shader fine-tuning:
        noise = 0.02
        brightness = 0.9
        contrast = 0.9
        saturation = 1.1
    }

    # Hardware-accelerated SceneFX window drop shadows & ambient shading:
    shadow {
        # Enable GPU-rendered drop shadows underneath windows
        enabled = true

        # Shadow blur sigma / softness radius in pixels (higher = softer diffusion, default: 12.0)
        range = 2.0

        # Shadow color for active focused window (hex format: #RRGGBBAA)
        color = #00000066

        # Shadow color for inactive unfocused windows (hex format: #RRGGBBAA)
        color_inactive = #00000044

        # Shadow offset [X, Y] in pixels
        offset = 0 2
    }
}

# ==============================================================================
# 7. ANIMATION ENGINE
# ==============================================================================
# GPU-accelerated motion physics for windows, layer surfaces, and workspace sliding.
# Available easing curves:
# - ease_out_cubic  : Silky smooth, rapid deceleration with zero overshoot (recommended)
# - smooth_out      : Fast, clean deceleration for rapid window exits
# - overshoot       : Springy pop-in bounce passing target dimensions
# - md3_decel       : Material Design 3 deceleration curve
# - ease_in_out_circ: Smooth circular acceleration/deceleration
# - linear          : Constant velocity
animations {
    # Master switch for all animations across the compositor
    enabled = true

    # Window transitions (spawning, closing, moving, floating/tiling swaps):
    windows {
        enabled = true
        duration = 260
        curve = ease_out_cubic

        # Window opening entrance animation (scale + independent opacity fade):
        open {
            duration = 260
            curve = ease_out_cubic
            scale = 0.82

            # Micro-control opacity fade timeline:
            fade {
                enabled = true
                duration = 200
                curve = ease_out_cubic
            }
        }

        # Window closing exit animation:
        close {
            duration = 200
            curve = ease_out_cubic
            scale = 0.80

            # Micro-control opacity fade timeline:
            fade {
                enabled = true
                duration = 160
                curve = smooth_out
            }
        }
    }

    # Layer surface transitions (Wayland panels, launchers, lockscreens, overlays):
    layers {
        enabled = true
        duration = 200
        curve = ease_out_cubic
        popin_scale = 0.85

        # Entrance animation for layer surfaces:
        open {
            enabled = true
            duration = 200
            curve = ease_out_cubic

            fade {
                enabled = true
                duration = 180
                curve = ease_out_cubic
            }
        }

        # Exit / dismissal animation for layer surfaces:
        close {
            enabled = true
            duration = 200
            curve = ease_out_cubic

            fade {
                enabled = true
                duration = 160
                curve = ease_out_cubic
            }
        }
    }

    # Workspace swipe and switch transitions:
    workspaces {
        enabled = true
        duration = 300
        curve = smooth_out
    }
}

# ==============================================================================
# 8. INPUT DEVICES, PERIPHERALS & GESTURES
# ==============================================================================
# Hardware peripheral configuration, XKB keymaps, touchpads, and multi-touch gestures.
input {
    # Default terminal emulator invoked by 'terminal' action
    terminal = kitty

    # Keyboard layout & repeat behavior:
    keyboard {
        layout = us
        # variant =
        # options = grp:alt_shift_toggle,caps:escape
        # model =
        repeat_rate = 25
        repeat_delay = 600
    }

    # Touchpad gestures & ergonomics:
    touchpad {
        tap_to_click = true
        natural_scroll = false
        disable_while_typing = true
        accel_speed = 0.0
        accel_profile = adaptive
    }

    # Mouse pointer configuration:
    mouse {
        accel_speed = 0.0
        accel_profile = adaptive
        natural_scroll = false
    }

    # Touchscreen hardware association:
    touchscreen {
        # output = eDP-1
    }

    # Multi-finger trackpad and touchscreen gesture recognition:
    gestures {
        # Interactive workspace swipe kinematics & physics:
        workspace_swipe {
            touchpad_multiplier = 1.0
            touchscreen_multiplier = 1.0
            swipe_threshold = 50
            touchscreen_threshold = 100
            cancel_ratio = 0.30
            min_speed_to_force = 0.3
            edge_resistance = 0.15
        }

        # Discrete gesture bindings:
        # Format: gesture = swipe:<fingers>:<direction>, <action>
        # Supported directions: left, right, up, down
        gesture = swipe:3:left, next_ws
        gesture = swipe:3:right, prev_ws
        gesture = swipe:3:up, toggle_fullscreen
        gesture = swipe:3:down, toggle_floating
        gesture = swipe:4:up, miqulauncher
        gesture = swipe:4:down, miqulock
    }
}

# ==============================================================================
# 9. XWAYLAND COMPATIBILITY
# ==============================================================================
# High-DPI unscaling for legacy X11 applications running through XWayland.
xwayland {
    # Force 1:1 unscaled buffer rendering to eliminate blur on scaled displays
    force_zero_scaling = true
}

# ==============================================================================
# 10. LAYER SURFACE RULES (PER NAMESPACE)
# ==============================================================================
# Per-layer micro-level overrides for blur shaders, geometry animations, and fade curves.
# Supported animation styles:
# - unroll      : Smooth vertical curtain rollout / roll-up from top
# - fold / roll : Vertical rollout collapse
# - unfold      : Symmetric vertical expansion from center
# - popin       : Scale bounce with opacity fade (ideal for centered modals)
# - slide       : Edge sliding (slide top, slide bottom, slide left, slide right)
# - fade        : Pure opacity fade without spatial movement
# - none        : Instant appearance/dismissal without animation

# Example 1: Full-screen launcher with unroll spatial rollout and decoupled fade:
layerrule "miqulauncher" {
    blur = true

    open {
        enabled = true
        animation = unroll
        duration = 240
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 200
            curve = ease_out_cubic
        }
    }

    close {
        enabled = true
        animation = fold
        duration = 180
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 150
            curve = ease_out_cubic
        }
    }
}

# Example 2: Centered authentication dialog with popin scaling and rapid fade:
layerrule "miqupolkit" {
    blur = true

    open {
        enabled = true
        animation = popin
        scale = 0.85
        duration = 220
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 180
            curve = ease_out_cubic
        }
    }

    close {
        enabled = true
        animation = popin
        scale = 0.85
        duration = 180
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 140
            curve = ease_out_cubic
        }
    }
}

# Example 3: Top panel sliding from screen edge with no fade (pure edge motion):
layerrule "waybar" {
    blur = true

    open {
        animation = slide_top
        duration = 200
        fade {
            enabled = false
        }
    }

    close {
        animation = slide_top
        duration = 200
        fade {
            enabled = false
        }
    }
}

# Example 4: Notification daemon with slide from right and fast fade:
layerrule "dunst" {
    blur = true

    open {
        animation = slide_right
        duration = 220
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 160
            curve = ease_out_cubic
        }
    }

    close {
        animation = slide_right
        duration = 180
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 140
            curve = ease_out_cubic
        }
    }
}

layerrule "notifications" {
    blur = true

    open {
        animation = slide_right
        duration = 220
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 160
            curve = ease_out_cubic
        }
    }

    close {
        animation = slide_right
        duration = 180
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 140
            curve = ease_out_cubic
        }
    }
}

# Example 5: Instant rendering without motion for desktop wallpaper / canvas:
layerrule "miqudesk" {
    open {
        animation = none
    }
    close {
        animation = none
    }
}

layerrule "miqubg" {
    open {
        animation = slide_right
        duration = 350
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 250
            curve = ease_out_cubic
        }
    }

    close {
        animation = none
    }
}

layerrule "wallpaper" {
    open {
        animation = slide_right
        duration = 350
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 250
            curve = ease_out_cubic
        }
    }

    close {
        animation = none
    }
}

# ==============================================================================
# 11. WINDOW RULES (PER APPLICATION / CLASS / TITLE)
# ==============================================================================
# Custom tiling policies, workspace pinning, opacity, blur, and animation overrides.
# Targets match app_id, window class, or window title substring.

# System dialogs and portal floating:
windowrule "xdg-desktop-portal-gtk" {
    float = true
}

windowrule "org.freedesktop.impl.portal.desktop.gtk" {
    float = true
}

# Example 1: Centered modal with bouncy overshoot entrance and distinct fade:
windowrule "zenity" {
    float = true
    center = true
    
    open {
        animation = popin
        scale = 0.80
        duration = 220
        curve = overshoot
        fade {
            enabled = true
            duration = 180
            curve = ease_out_cubic
        }
    }

    close {
        animation = popin
        scale = 0.75
        duration = 160
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 140
            curve = smooth_out
        }
    }
}

# Example 2: Volume control modal with custom scale and opacity:
windowrule "pavucontrol" {
    float = true
    center = true
    opacity = 0.95
    
    open {
        animation = popin
        scale = 0.88
        duration = 200
        curve = ease_out_cubic
        fade {
            enabled = true
            duration = 180
            curve = ease_out_cubic
        }
    }
}

# Example 3: Privacy & browser windows:
windowrule "Tor Browser" {
    float = true
}

# Additional rule examples:
# windowrule "firefox" {
